<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Игры</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="page">
      <h1 class="page-title">Игры</h1>

      <form class="game-form" data-testid="entity-form">
        <label class="form-field">
          Название
          <input type="text" name="title" placeholder="Minecraft" required />
        </label>
        <label class="form-field">
          Год выпуска
          <input
            type="number"
            name="releaseYear"
            min="1950"
            max="2100"
            placeholder="2011"
            required
          />
        </label>
        <button type="submit" class="button">Добавить игру</button>
      </form>

      <section class="game-list" data-testid="entity-list"></section>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
