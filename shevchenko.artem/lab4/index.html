<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Заказы</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Мои заказы</h1>

      <section class="add-order">
        <h2>Добавить заказ</h2>
        <form class="order-form" data-testid="entity-form">
          <label class="field">
            ID заказа
            <input name="orderId" type="number" min="1" step="1" required />
          </label>
          <label class="field">
            Статус
            <select name="status" required></select>
          </label>
          <button type="submit">Добавить</button>
        </form>
        <p class="message" data-testid="form-message" role="status"></p>
      </section>

      <section>
        <h2>Список заказов</h2>
        <div class="orders" data-testid="entity-list"></div>
      </section>
    </main>

    <script type="module" src="main.ts"></script>
  </body>
</html>
